[package]
name = "cetz-nurbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
plugin = ["dep:wasm-minimal-protocol"]

[dependencies]
brepkit-math = "=3.4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-minimal-protocol = { version = "0.1", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
