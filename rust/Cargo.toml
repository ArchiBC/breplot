[package]
name = "breplot"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "breplot-cli"
path = "src/main.rs"

[dependencies]
cetz-nurbs = { path = "../cetz-nurbs/rust", default-features = false }
brepkit-io = "=3.4.18"
brepkit-math = "=3.4.18"
brepkit-operations = "=3.4.18"
brepkit-topology = "=3.4.18"
maquette-core = { path = "vendor/maquette-core" }
png = "0.18"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-minimal-protocol = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
